name: KiCad SVG renders
description: Render KiCad schematics and PCBs to SVG and commit them, so design changes show up as image diffs on GitHub.
branding:
  icon: cpu
  color: green

inputs:
  kicad-version:
    description: Tag of the kicad/kicad Docker image to render with.
    default: '10.0.6'
  path:
    description: Directory to search for KiCad projects.
    default: '.'
  output-dir:
    description: Where to write the SVGs, relative to `path`.
    default: kicad-svg
  pcb-layers:
    description: PCB layers to export, one SVG each.
    default: '*.Cu,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts,F.Courtyard,B.Courtyard'
  pcb-common-layers:
    description: Layers drawn on every PCB SVG.
    default: Edge.Cuts
  force:
    description: Re-render every project even if its inputs are unchanged.
    default: 'false'
  commit:
    description: Commit and push the updated renders.
    default: 'true'
  commit-message:
    description: Message for the render commit.
    default: 'Update KiCad SVG renders [skip ci]'
  amend:
    description: >-
      On push events, fold the renders into the pushed commit and force-push it
      instead of adding a separate commit. Falls back to a separate commit if
      the branch moved in the meantime.
    default: 'false'
  cache-image:
    description: >-
      Keep the KiCad Docker image in the GitHub Actions cache and load it from
      there instead of pulling it from Docker Hub on every run.
    default: 'false'

outputs:
  changed:
    description: '`true` if any render changed.'
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Restore KiCad image from cache
      id: image-cache
      if: inputs.cache-image == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/kicad-image.tar.zst
        key: kicad-image-${{ inputs.kicad-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Get KiCad image
      shell: bash
      env:
        IMAGE: kicad/kicad:${{ inputs.kicad-version }}
        CACHE_HIT: ${{ steps.image-cache.outputs.cache-hit }}
      run: |
        if [[ $CACHE_HIT == true ]]; then
          zstd -dc "$RUNNER_TEMP/kicad-image.tar.zst" | docker load -q >/dev/null
          echo "Loaded $IMAGE from the Actions cache in ${SECONDS}s"
        else
          docker pull -q "$IMAGE" >/dev/null
          echo "Pulled $IMAGE from Docker Hub in ${SECONDS}s"
        fi

    - name: Render SVGs
      shell: bash
      env:
        KICAD_VERSION: ${{ inputs.kicad-version }}
        PROJECT_PATH: ${{ inputs.path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        PCB_LAYERS: ${{ inputs.pcb-layers }}
        PCB_COMMON_LAYERS: ${{ inputs.pcb-common-layers }}
        FORCE: ${{ inputs.force }}
      run: |
        args=(--kicad-version "$KICAD_VERSION" --output "$OUTPUT_DIR"
          --layers "$PCB_LAYERS" --common-layers "$PCB_COMMON_LAYERS")
        [[ $FORCE == true ]] && args+=(--force)
        bash "$GITHUB_ACTION_PATH/render.sh" "${args[@]}" "$PROJECT_PATH"

    - name: Export KiCad image for the cache
      if: inputs.cache-image == 'true' && steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        IMAGE: kicad/kicad:${{ inputs.kicad-version }}
      run: |
        docker save "$IMAGE" | zstd -q -T0 -3 -o "$RUNNER_TEMP/kicad-image.tar.zst"
        echo "Exported $IMAGE ($(du -h "$RUNNER_TEMP/kicad-image.tar.zst" | cut -f1)) in ${SECONDS}s"

    - name: Save KiCad image to cache
      if: inputs.cache-image == 'true' && steps.image-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/kicad-image.tar.zst
        key: kicad-image-${{ inputs.kicad-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Commit and push
      id: commit
      if: inputs.commit == 'true'
      shell: bash
      env:
        RENDER_DIR: ${{ inputs.path }}/${{ inputs.output-dir }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        AMEND: ${{ inputs.amend }}
      run: bash "$GITHUB_ACTION_PATH/commit.sh"
